name: BTInspector
options:
  bundleIdPrefix: com.tokeiyo929
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
targets:
  BTInspector:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokeiyo929.btinspector
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        # 打包态用 ASCII 显示名：SideStore 注册 App ID 时 appIdName 不吃非 ASCII
        #（classday-ios 踩坑），中文名在打包步骤写进 zh-Hans.lproj/InfoPlist.strings。
        CFBundleDisplayName: BT Inspector
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        BTBuild: "${BT_BUILD}"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: 用于扫描附近蓝牙耳机的广播、读取它们公开的 GATT 服务（型号、电量、LE Audio 能力），据此判断耳机正在使用哪些蓝牙协议。数据只在本机显示，不会上传。
        NSBluetoothPeripheralUsageDescription: 需要蓝牙权限来读取耳机的广播与公开服务，判断使用的蓝牙协议。
schemes:
  BTInspector:
    build:
      targets:
        BTInspector: all
